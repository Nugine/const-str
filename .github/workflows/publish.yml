name: Publish

# Both crates need a crates.io trusted publisher configured for this
# repository, workflow, and the `crates.io` environment below.

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates.io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Check that the tag matches the crate versions
        run: |
          set -euo pipefail
          for crate in const-str const-str-proc-macro; do
            version=$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg crate "$crate" '.packages[] | select(.name == $crate) | .version')
            if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
              echo "tag ${GITHUB_REF_NAME} does not match ${crate} version ${version}" >&2
              exit 1
            fi
          done
      - run: cargo test --all-features --locked
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish const-str-proc-macro
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p const-str-proc-macro --locked
      - name: Publish const-str
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p const-str --locked
